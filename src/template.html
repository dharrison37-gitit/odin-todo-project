<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done n Done</title>
</head>

<body>

    <div class="container">

        <header>
            <h1>Todo Logo</h1>
        </header>

        <section id="new">
        </section>

        <section id="todos">
            <h3>Todos</h3>
            <div class="todos">
                <div class="item">Item</div>
            </div>
        </section>
        <dialog id="todo-dialog">
            <form action="dialog" id="todo-form">
                <input type="text" name="title" id="title" placeholder="Title">
                <input type="text" name="description" id="description" placeholder="Description">
                <input type="date" name="due-date" id="due-date" placeholder="Due Date">
                <select name="priority" id="priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <textarea name="notes" id="notes" cols="20" rows="5" placeholder="Todo Notes"></textarea>
                <input type="checkbox" name="completed" id="completed">
                <button id="add-todo" class="btn">Add</button>
                <button id="cancel-todo" class="btn">Cancel</button>
            </form>
        </dialog>

        <section id="projects">
            <div class="project-grid"></div>
        </section>

        <dialog id="project-dialog">
            <form action="dialog" id="project-form">
                <input class="dialog-input" type="text" name="name" id="name" placeholder="Project name" maxlength="30"
                    required>
                <button id="add-btn">Add</button>
                <button id="cancel">Cancel</button>
            </form>
        </dialog>

        <footer>
            Footer Content
        </footer>

    </div>

</body>

</html>
